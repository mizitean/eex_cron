name: trigger

# Toto repo je VEREJNE a neobsahuje ziadne data ani kod -- len cron.
#
# Preco existuje: ZMERANE 16. 9. 2026, ze na privatnom repe mizitean/eex_data
# sa scheduled workflow NESPUSTI. Cron bol nastaveny na */15, sloty :30 aj :45
# presli, nula behov -- pritom workflow_dispatch na tom istom workflowe presiel
# patkrat za sebou. Vo verejnom repe cron bezi spolahlivo a bez limitu minut.
#
# Minuty za samotne stahovanie sa micha ju PRIVATNEMU repu. Tu odide par sekund.
#
# Secret EEX_TOKEN je fine-grained PAT s pravom Actions: write VYLUCNE na
# mizitean/eex_data. Ked by unikol, najhorsie co s nim niekto spravi je,
# ze spusti stahovanie.

on:
  # ZIADNY schedule. 16. 9. 2026 sa zdalo, ze cron tu nebezi; od 17. 9. bezal --
  # ale ~4,5 h neskoro (09:30Z-09:58Z) a spustil DRUHY denny beh v eex_data,
  # ktory zopakoval 100 % prace prveho (github.sha zmrazene pri vytvoreni
  # behu vo fronte). Jediny spustac je cron-job.org, job 8459181, 05:17 UTC.
  workflow_dispatch:

jobs:
  spusti:
    runs-on: ubuntu-latest
    steps:
      - name: spusti daily v privatnom repe
        env:
          GH_TOKEN: ${{ secrets.EEX_TOKEN }}
        run: |
          # REST endpoint priamo, s explicitnym ref. `gh workflow run` si chce
          # najprv precitat default branch a na to potrebuje Contents: read --
          # token ma zamerne len Actions: write.
          gh api -X POST             repos/mizitean/eex_data/actions/workflows/daily.yml/dispatches             -f ref=main
          echo "spustene: https://github.com/mizitean/eex_data/actions"
